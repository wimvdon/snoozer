name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build, unit test and lint
        run: ./gradlew --stacktrace assembleDebug assembleRelease testDebugUnitTest lintDebug

      - name: List lint issues
        if: always()
        run: |
          jq -r '.runs[].results[] | "\(.level) \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // "-") \(.message.text)"' \
            app/build/reports/lint-results-debug.sarif || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: snoozer-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
