name: CI

# Unit tests, the debug APK of the commit, and a release build so R8 problems show up before a
# release. Runs once per pull request push, and on main after a merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags, so the debug build is versioned from the latest release (git describe).
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: snoozer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
